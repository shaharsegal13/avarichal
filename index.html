<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אבטיחל</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1b; --border:#d3d6da; --key:#d3d6da; --green:#6aaa64; --yellow:#c9b458; --gray:#787c7e; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121213; --fg:#fff; --border:#3a3a3c; --key:#818384; --gray:#3a3a3c; --card:#1e1e20; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,"Segoe UI",Arial,sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { position:relative; width:100%; text-align:center; padding:12px; border-bottom:1px solid var(--border); font-size:1.5rem; font-weight:700; }
  #statsBtn { position:absolute; left:12px; top:50%; transform:translateY(-50%); border:0; background:none; font-size:1.5rem; cursor:pointer; }
  #msg { height:28px; margin:8px 0 0; font-weight:600; text-align:center; }
  #grid { display:grid; gap:6px; margin:8px 0 16px; direction:rtl; }
  .row { display:grid; gap:6px; direction:rtl; }
  .tile { width:clamp(46px,14vw,62px); height:clamp(46px,14vw,62px); border:2px solid var(--border);
          display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:700; }
  .tile.filled { border-color:#878a8c; }
  .tile.green, .tile.yellow, .tile.gray { color:#fff; border-color:transparent; }
  .green { background:var(--green); } .yellow { background:var(--yellow); } .gray { background:var(--gray); }
 
  /* מקלדת בסגנון האייפון: רשת של 20 חצאי עמודות, כל מקש תופס 2 */
  #kb { --g:6px; --u:calc((min(100vw,480px) - 8px - 9 * var(--g)) / 10);
        display:flex; flex-direction:column; gap:10px; align-items:center; margin-bottom:16px; width:100%; max-width:480px; padding:0 4px; direction:ltr; }
  .krow { display:grid; grid-template-columns:repeat(20, 1fr); column-gap:var(--g); width:100%; direction:ltr; }
  .key { min-width:0; height:calc(var(--u) * 1.5); border:0; border-radius:6px; background:var(--key); color:var(--fg);
         font-size:1.4rem; font-weight:500; cursor:pointer; padding:0; font-family:inherit; touch-action:manipulation;
         display:flex; align-items:center; justify-content:center; }
  .key svg { width:26px; height:26px; }
  .key.green { background:var(--green); color:#fff; } .key.yellow { background:var(--yellow); color:#fff; }
  .key.gray { background:var(--gray); color:#fff; }
  .key.enter.dim { opacity:.55; }

  #share { display:none; margin:8px; padding:10px 22px; font-size:1rem; font-weight:700; border:0; border-radius:6px;
           background:var(--green); color:#fff; cursor:pointer; font-family:inherit; }
  @keyframes shake { 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .shake { animation:shake .3s; }
 
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  .modal.open { display:flex; }
  .card { position:relative; background:var(--card); color:var(--fg); border-radius:12px; padding:22px 20px; width:100%; max-width:380px; max-height:90vh; overflow:auto; }
  .card h2 { margin:0 0 14px; text-align:center; font-size:1.2rem; }
  .card h3 { margin:18px 0 8px; text-align:center; font-size:1rem; }
  #closeBtn { position:absolute; left:10px; top:8px; border:0; background:none; color:var(--fg); font-size:1.4rem; cursor:pointer; }
  .nums { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; }
  .num b { display:block; font-size:1.7rem; }
  .num span { font-size:.72rem; opacity:.8; }
  .drow { display:flex; align-items:center; gap:8px; margin:4px 0; direction:rtl; }
  .drow .lbl { width:14px; text-align:center; font-weight:700; }
  .drow .bar { background:var(--gray); color:#fff; font-size:.85rem; font-weight:700; padding:2px 8px; min-width:26px; text-align:left; border-radius:3px; }
  .drow .bar.hit { background:var(--green); }
  #avg { text-align:center; margin-top:10px; font-size:.9rem; opacity:.85; }
</style>

const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
 
// ---------- סטטיסטיקה ----------
let stats = { played:0, won:0, streak:0, maxStreak:0, lastWinDay:null, lastCountedDay:null, dist:Array(MAX_TRIES).fill(0) };
try {
  const s = JSON.parse(localStorage.getItem(STATS_KEY));
  if (s) { stats = Object.assign(stats, s); if (!Array.isArray(stats.dist) || stats.dist.length !== MAX_TRIES) stats.dist = Array(MAX_TRIES).fill(0); }
} catch (e) {}
const saveStats = () => { try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {} };
 
function recordResult() {
  if (stats.lastCountedDay === day) return;
  stats.played++;
  if (state.won) {
    stats.won++;
    stats.streak = (stats.lastWinDay === day - 1) ? stats.streak + 1 : 1;
    stats.lastWinDay = day;
    stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
    stats.dist[state.guesses.length - 1]++;
  } else {
    stats.streak = 0;
  }
  stats.lastCountedDay = day;
  saveStats();
}
 
function currentStreak() {
  return (stats.lastWinDay !== null && stats.lastWinDay >= day - 1) ? stats.streak : 0;
}
 
function renderStats() {
  document.getElementById("sPlayed").textContent = stats.played;
  document.getElementById("sPct").textContent = (stats.played ? Math.round(stats.won / stats.played * 100) : 0) + "%";
  document.getElementById("sStreak").textContent = currentStreak();
  document.getElementById("sMax").textContent = stats.maxStreak;
 
  const distEl = document.getElementById("dist");
  distEl.innerHTML = "";
  const max = Math.max(1, ...stats.dist);
  const todayIdx = (state.done && state.won) ? state.guesses.length - 1 : -1;
  stats.dist.forEach((n, i) => {
    const row = document.createElement("div");
    row.className = "drow";
    const lbl = document.createElement("div");
    lbl.className = "lbl";
    lbl.textContent = i + 1;
    const bar = document.createElement("div");
    bar.className = "bar" + (i === todayIdx ? " hit" : "");
    bar.style.width = Math.max(8, Math.round(n / max * 100)) + "%";
    bar.textContent = n;
    row.appendChild(lbl);
    row.appendChild(bar);
    distEl.appendChild(row);
  });
 
  const total = stats.dist.reduce((a, b) => a + b, 0);
  const sum = stats.dist.reduce((a, n, i) => a + n * (i + 1), 0);
  document.getElementById("avg").textContent = total ? "ממוצע ניסיונות בניצחון: " + (sum / total).toFixed(1) : "";
}
 
const modal = document.getElementById("modal");
function openStats() { renderStats(); modal.classList.add("open"); }
document.getElementById("statsBtn").onclick = openStats;
document.getElementById("closeBtn").onclick = () => modal.classList.remove("open");
modal.onclick = e => { if (e.target === modal) modal.classList.remove("open"); };
 
// ---------- משחק ----------
let current = "";
const gridEl = document.getElementById("grid");
const msgEl = document.getElementById("msg");
const kbEl = document.getElementById("kb");
const shareBtn = document.getElementById("share");
 
if (day < 0) {
  msgEl.textContent = "המשחק עוד לא התחיל. חכי עד " + START_DATE;
}
 
// בניית הלוח
const rows = [];
for (let r = 0; r < MAX_TRIES; r++) {
  const row = document.createElement("div");
  row.className = "row";
  row.style.gridTemplateColumns = `repeat(${LEN}, auto)`;
  const tiles = [];
  for (let c = 0; c < LEN; c++) {
    const t = document.createElement("div");
    t.className = "tile";
    row.appendChild(t);
    tiles.push(t);
  }
  gridEl.appendChild(row);
  rows.push(tiles);
}
 
// מקלדת
const layout = LAYOUTS[LANG] || LAYOUTS.he;
const VALID = new Set(layout.flat().filter(k => k.length === 1).map(norm));
const keyEls = {};   // אות מנורמלת -> רשימת כפתורים
const bestColor = {};
const ICON_BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z" fill="currentColor"/><path d="M12.5 9.5l5 5m0-5l-5 5" stroke="var(--key)" stroke-width="1.8" stroke-linecap="round"/></svg>';
const ICON_ENTER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v7a2 2 0 0 1-2 2H5M9 10l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function makeKey(val, label, cls, html, aria) {
  const b = document.createElement("button");
  b.className = "key" + (cls ? " " + cls : "");
  if (html) b.innerHTML = html; else b.textContent = label;
  if (aria) b.setAttribute("aria-label", aria);
  b.onclick = () => press(val);
  return b;
}
const SPECIAL_SPAN = LANG === "he" ? 4 : 3;
let enterEl = null;
layout.forEach(keys => {
  const kr = document.createElement("div");
  kr.className = "krow";
  const total = keys.reduce((a, k) => a + (k.length > 1 ? SPECIAL_SPAN : 2), 0);
  let col = (20 - total) / 2 + 1;
  keys.forEach(l => {
    let k, span = 2;
    if (l === "back") { k = makeKey("back", "", "back", ICON_BACK, "מחיקה"); span = SPECIAL_SPAN; }
    else if (l === "enter") { k = makeKey("enter", "", "enter dim", ICON_ENTER, "אישור"); span = SPECIAL_SPAN; enterEl = k; }
    else {
      const n = norm(l);
      k = makeKey(n, l);
      (keyEls[n] = keyEls[n] || []).push(k);
    }
    k.style.gridColumn = col + " / span " + span;
    col += span;
    kr.appendChild(k);
  });
  kbEl.appendChild(kr);
});
function updateEnter() { if (enterEl) enterEl.classList.toggle("dim", [...current].length < LEN); }

function score(guess) {
  const res = Array(LEN).fill("gray");
  const g = [...guess], a = [...answer];
  const left = {};
  for (let i = 0; i < LEN; i++) {
    if (g[i] === a[i]) res[i] = "green"; else left[a[i]] = (left[a[i]] || 0) + 1;
  }
  for (let i = 0; i < LEN; i++) {
    if (res[i] !== "green" && left[g[i]] > 0) { res[i] = "yellow"; left[g[i]]--; }
  }
  return res;
}
 
const RANK = { gray:1, yellow:2, green:3 };
function paintRow(r, guess, colors) {
  const g = [...guess];
  rows[r].forEach((t, i) => {
    t.textContent = display(g[i], i === LEN - 1);
    t.className = "tile filled " + colors[i];
  });
  g.forEach((ch, i) => {
    const els = keyEls[ch]; if (!els) return;
    if (!bestColor[ch] || RANK[colors[i]] > RANK[bestColor[ch]]) {
      bestColor[ch] = colors[i];
      els.forEach(k => { k.classList.remove("green","yellow","gray"); k.classList.add(colors[i]); });
    }
  });
}
 
function drawCurrent() {
  updateEnter();
  const r = state.guesses.length;
  if (r >= MAX_TRIES || state.done) return;
  const g = [...current];
  rows[r].forEach((t, i) => {
    t.textContent = g[i] ? display(g[i], i === LEN - 1) : "";
    t.className = "tile" + (g[i] ? " filled" : "");
  });
}
 
function toast(t) { msgEl.textContent = t; }
 
function press(val) {
  if (state.done || day < 0) return;
  if (val === "back") { current = [...current].slice(0, -1).join(""); }
  else if (val === "enter") { submit(); return; }
  else if ([...current].length < LEN) { current += val; if (msgEl.textContent === "המילה לא במילון" || msgEl.textContent === "אין מספיק אותיות") toast(""); }
  drawCurrent();
}
 
function submit() {
  if ([...current].length < LEN) {
    const rowEl = rows[state.guesses.length][0].parentElement;
    rowEl.classList.add("shake");
    setTimeout(() => rowEl.classList.remove("shake"), 300);
    toast("אין מספיק אותיות");
    return;
  }
  if (!isWord(current)) {
    const rowEl = rows[state.guesses.length][0].parentElement;
    rowEl.classList.add("shake");
    setTimeout(() => rowEl.classList.remove("shake"), 300);
    toast("המילה לא במילון");
    return;
  }
  toast("");
  const r = state.guesses.length;
  state.guesses.push(current);
  paintRow(r, current, score(current));
  if (current === answer) { state.done = true; state.won = true; }
  else if (state.guesses.length >= MAX_TRIES) { state.done = true; }
  current = "";
  save();
  if (state.done) { recordResult(); finish(true); }
}
 
function finish(openModal) {
  toast(state.won ? "כל הכבוד! 🎉" : "המילה הייתה: " + answerRaw);
  shareBtn.style.display = "inline-block";
  if (openModal) setTimeout(openStats, 1200);
}
 
shareBtn.onclick = () => {
  const emoji = { green:"🟩", yellow:"🟨", gray:"⬛" };
  const lines = state.guesses.map(g => score(g).map(c => emoji[c]).join(""));
  const text = `אבטיחל #${day + 1} ${state.won ? state.guesses.length : "X"}/${MAX_TRIES}\n` + lines.join("\n");
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else navigator.clipboard.writeText(text).then(() => toast("הועתק ללוח"));
};
 
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Enter") return press("enter");
  if (e.key === "Backspace") return press("back");
  const ch = norm(e.key);
  if (ch.length === 1 && VALID.has(ch)) press(ch);
});
 
// שחזור מצב שמור
updateEnter();
state.guesses.forEach((g, r) => paintRow(r, g, score(g)));
if (state.done) { recordResult(); finish(false); }
</script>
</body>
